[package]
name = "okm-series"
version = "0.1.0"
edition = "2024"
description = "An append-only log of timestamped records: buckets by the hour, blocks, an index, and a dictionary that earns its place."

[dependencies]
okm-wire = { path = "../okm-wire" }
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3"
# Only for `examples/log_vs_parquet.rs`: the comparison needs a columnar writer, and the
# log itself must stay free of it.
arrow = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }

[lints]
workspace = true
