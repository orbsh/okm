[package]
name = "okm-series"
version = "0.1.0"
edition = "2024"
description = "An append-only log of timestamped records: buckets by the hour, blocks, an index, and a dictionary that earns its place."

[dependencies]
okm-wire = { path = "../okm-wire" }
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
