[package]
name = "okm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
okm-derive = { path = "../okm-derive" }
okm-wire = { path = "../okm-wire" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
getrandom = "0.3"
fjall = { version = "3.1.10", optional = true }
redb = { version = "4.2", optional = true }
slatedb = { version = "0.16.0", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
object_store = { version = "0.13", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }
arrow = { version = "60", optional = true }
parquet = { version = "60", optional = true, default-features = false, features = ["arrow"] }
parquet-variant = { version = "60", optional = true }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[features]
default = []
schema-serde = ["dep:serde", "dep:serde_json"]
test-engines = ["slatedb"]
slatedb = ["dep:slatedb", "dep:tokio"]
fjall = ["dep:fjall", "dep:tempfile"]
redb = ["dep:redb", "dep:tempfile"]
localstorage = ["dep:web-sys"]
arrow = ["dep:arrow"]
parquet = ["dep:parquet", "dep:parquet-variant", "arrow"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
okm-dynamic = { path = "../okm-dynamic" }
okm-wire = { path = "../okm-wire" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
arrow = { version = "60" }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
trybuild = "1"
criterion = "0.5"

[[bench]]
name = "core_paths"
harness = false

[[example]]
name = "py_helper"
required-features = ["schema-serde"]

[[example]]
name = "changelog_tax"
required-features = ["test-engines", "fjall"]

[[example]]
name = "engine_paths"
required-features = ["test-engines", "fjall"]

[[test]]
name = "arrow_bridge_test"
required-features = ["arrow"]

[[test]]
name = "codec_v2_test"
required-features = ["parquet"]

[[test]]
name = "variant_smoke"
required-features = ["parquet"]

[[test]]
name = "variant_export_test"
required-features = ["parquet", "test-engines"]

[[test]]
name = "tooling_test"
required-features = ["parquet"]

# parquet for the export/import mirrors, test-engines for the store they run on:
# the file calls `TestStore::slatedb_mem()` and `Graph::to_record_batch_table`,
# so neither feature alone compiles it.
[[test]]
name = "import_table_test"
required-features = ["parquet", "test-engines"]

[[test]]
name = "deprecated_index_test"
required-features = ["test-engines"]

[[test]]
name = "meta_test"
required-features = ["test-engines"]

# The change log (ADR-0045) runs on a real engine like every other write-path
# suite, so it needs `test-engines`; nothing else.
[[test]]
name = "changelog_test"
required-features = ["test-engines"]

[[test]]
name = "key_row_split_test"
required-features = ["test-engines"]

[[test]]
name = "write_refusal_test"
required-features = ["test-engines"]

[[test]]
name = "dynamic_cross_test"
required-features = ["test-engines"]

[[test]]
name = "engine_matrix_test"
required-features = ["test-engines", "fjall", "redb"]

[[test]]
name = "index_test"
required-features = ["test-engines"]

[[test]]
name = "integration"
required-features = ["test-engines"]

[[test]]
name = "kv_nest_test"
required-features = ["test-engines"]

[[test]]
name = "multi_tenant_test"
required-features = ["test-engines"]

[[test]]
name = "reduce_test"
required-features = ["test-engines"]

[[test]]
name = "remote_test"
required-features = ["test-engines"]

[[test]]
name = "save_into_test"
required-features = ["test-engines"]

[[test]]
name = "subscribe_test"
required-features = ["test-engines"]

[[test]]
name = "upsert_test"
required-features = ["test-engines"]

# The uuid suite opens a temp-dir engine (`TestStore::fjall_tmp`), and that
# constructor is `#[cfg(feature = "fjall")]` — `test-engines` alone brings
# slatedb only, so the suite must name the engine it opens.
[[test]]
name = "uuid_key"
required-features = ["test-engines", "fjall"]

[[test]]
name = "wrappers_test"
required-features = ["test-engines"]

[[test]]
name = "write_commit_test"
required-features = ["test-engines"]

[[test]]
name = "bare_shard_test"
required-features = ["test-engines"]

[[test]]
name = "wire_client_test"
required-features = ["test-engines"]

[lints]
workspace = true
