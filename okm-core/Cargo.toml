[package]
name = "okm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
okm-derive = { path = "../okm-derive" }
okm-wire = { path = "../okm-wire" }
serde = { version = "1", features = ["derive"], optional = true }
fjall = { version = "3.1.10", optional = true }
redb = { version = "4.2", optional = true }
slatedb = { version = "0.16.0", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
object_store = { version = "0.13", optional = true }
arrow = { version = "60", optional = true }
parquet = { version = "60", optional = true, default-features = false, features = ["arrow"] }
parquet-variant = { version = "60", optional = true }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[features]
default = []
schema-serde = ["dep:serde"]
test-engines = ["slatedb"]
slatedb = ["dep:slatedb", "dep:tokio"]
fjall = ["dep:fjall", "dep:tempfile"]
redb = ["dep:redb", "dep:tempfile"]
arrow = ["dep:arrow"]
parquet = ["dep:parquet", "dep:parquet-variant", "arrow"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
okm-dynamic = { path = "../okm-dynamic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
arrow = { version = "60" }
parquet = { version = "60", default-features = false, features = ["arrow"] }
trybuild = "1"
criterion = "0.5"

[[bench]]
name = "core_paths"
harness = false

[[test]]
name = "arrow_bridge_test"
required-features = ["arrow"]

[[test]]
name = "codec_v2_test"
required-features = ["parquet"]

[[test]]
name = "variant_smoke"
required-features = ["parquet"]

[[test]]
name = "variant_export_test"
required-features = ["parquet", "test-engines"]

[[test]]
name = "tooling_test"
required-features = ["parquet"]

[[test]]
name = "deprecated_index_test"
required-features = ["test-engines"]

[[test]]
name = "dynamic_cross_test"
required-features = ["test-engines"]

[[test]]
name = "engine_matrix_test"
required-features = ["test-engines", "fjall", "redb"]

[[test]]
name = "index_test"
required-features = ["test-engines"]

[[test]]
name = "integration"
required-features = ["test-engines"]

[[test]]
name = "kv_nest_test"
required-features = ["test-engines"]

[[test]]
name = "multi_tenant_test"
required-features = ["test-engines"]

[[test]]
name = "reduce_test"
required-features = ["test-engines"]

[[test]]
name = "remote_test"
required-features = ["test-engines"]

[[test]]
name = "save_into_test"
required-features = ["test-engines"]

[[test]]
name = "subscribe_test"
required-features = ["test-engines"]

[[test]]
name = "upsert_test"
required-features = ["test-engines"]

[[test]]
name = "wrappers_test"
required-features = ["test-engines"]

[[test]]
name = "bare_shard_test"
required-features = ["test-engines"]
