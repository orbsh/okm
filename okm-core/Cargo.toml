[package]
name = "okm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
okm-derive = { path = "../okm-derive" }
okm-wire = { path = "../okm-wire" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
getrandom = "0.3"
fjall = { version = "3.1.10", optional = true }
redb = { version = "4.2", optional = true }
tempfile = { version = "3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage"] }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[features]
default = []
schema-serde = ["dep:serde", "dep:serde_json"]
fjall = ["dep:fjall", "dep:tempfile"]
redb = ["dep:redb", "dep:tempfile"]
localstorage = ["dep:web-sys"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
okm-dynamic = { path = "../okm-dynamic" }
okm-wire = { path = "../okm-wire" }
okm-async = { path = "../okm-async", features = ["slatedb", "fjall", "redb"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
arrow = { version = "60" }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
trybuild = "1"
criterion = "0.5"

[[bench]]
name = "core_paths"
harness = false

[[example]]
name = "py_helper"
required-features = ["schema-serde"]

[[example]]
name = "changelog_tax"
required-features = ["fjall"]

[[example]]
name = "engine_paths"
required-features = ["fjall"]

# The store comes from the `okm-async` dev-dependency (ADR-0059): this file calls
# `TestStore::slatedb_mem()` and `Graph::to_record_batch_table`.
[[test]]
name = "deprecated_index_test"

[[test]]
name = "meta_test"

[[test]]
name = "faces_test"
required-features = ["schema-serde"]

[[test]]
name = "rebuild_test"

[[test]]
name = "subscribe_batch_test"

# The point verbs and their events (ADR-0047): put/merge/replace announce the
# row they leave, the removal verbs announce the row they take.
[[test]]
name = "subscribe_verbs_test"

# The change log (ADR-0045) runs on a real engine like every other write-path
# suite; the engine arrives through the `okm-async` dev-dependency.
[[test]]
name = "changelog_test"

[[test]]
name = "key_row_split_test"

[[test]]
name = "write_refusal_test"

[[test]]
name = "dynamic_cross_test"

[[test]]
name = "engine_matrix_test"
required-features = ["fjall", "redb"]

[[test]]
name = "index_test"

[[test]]
name = "integration"

[[test]]
name = "kv_nest_test"

[[test]]
name = "multi_tenant_test"

[[test]]
name = "reduce_test"

[[test]]
name = "remote_test"

[[test]]
name = "save_into_test"

[[test]]
name = "subscribe_test"

[[test]]
name = "upsert_test"

# The uuid suite opens a temp-dir engine (`TestStore::fjall_tmp`), which is
# `#[cfg(feature = "fjall")]` inside `okm-async`, so the suite must enable
# core's `fjall` as well.
[[test]]
name = "uuid_key"
required-features = ["fjall"]

[[test]]
name = "write_commit_test"

[[test]]
name = "bare_shard_test"

# Engine-backed targets whose matrix is empty without a backend: `TestStore::matrix()`
# yields nothing, so a plain `cargo test` would pass zeros. The skip is Cargo's and visible.

[[test]]
name = "bytes_test"

[[test]]
name = "embed_test"

[[test]]
name = "embed_two_level_test"

[[test]]
name = "list_test"

[[test]]
name = "obj_variants_test"

[[test]]
name = "partition_test"

[[test]]
name = "prefix_scan_test"

[[test]]
name = "relation_table_test"

[[test]]
name = "scan_range_test"

[[test]]
name = "vector_test"

[[test]]
name = "vocab_test"


[lints]
workspace = true
