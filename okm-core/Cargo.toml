[package]
name = "okm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
okm-derive = { path = "../okm-derive" }
okm-wire = { path = "../okm-wire" }
serde = { version = "1", features = ["derive"], optional = true }
fjall = { version = "3.1.10", optional = true }
slatedb = { version = "0.16.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
object_store = { version = "0.13", optional = true }
arrow = { version = "54", optional = true }
parquet = { version = "54", optional = true, default-features = false, features = ["arrow"] }

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[features]
default = []
schema-serde = ["dep:serde"]
fjall = ["dep:fjall"]
slatedb = ["dep:slatedb", "dep:tokio"]
arrow = ["dep:arrow"]
parquet = ["dep:parquet", "arrow"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
okm-dynamic = { path = "../okm-dynamic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
arrow = { version = "54" }
parquet = { version = "54", default-features = false, features = ["arrow"] }
trybuild = "1"

[[test]]
name = "arrow_bridge_test"
required-features = ["arrow"]

[[test]]
name = "codec_v2_test"
required-features = ["parquet"]

[[test]]
name = "tooling_test"
required-features = ["parquet"]
