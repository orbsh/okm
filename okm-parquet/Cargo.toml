[package]
name = "okm-parquet"
version = "0.1.0"
edition = "2024"
description = "Project the change log into Parquet: a standalone CLI with no link to the application."

[lib]
name = "okm_parquet"
path = "src/lib.rs"

[[bin]]
name = "okm-parquet"
path = "src/main.rs"

[dependencies]
okm-core = { path = "../okm-core", features = ["schema-serde", "fjall"] }
okm-wire = { path = "../okm-wire" }
okm-dynamic = { path = "../okm-dynamic", features = ["arrow", "replay"] }
arrow = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
parquet-variant = "60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
okm-derive = { path = "../okm-derive" }
okm-core = { path = "../okm-core", features = ["schema-serde"] }
okm-async = { path = "../okm-async", features = ["slatedb"] }
parquet = { version = "60", default-features = false, features = ["arrow"] }
tempfile = "3"

[lints]
workspace = true