[package]
name = "okm-value"
version = "0.1.0"
edition = "2024"
description = "Name vocabularies: the label-to-number mapping dynamic segments are written in"

[dependencies]
# The document map's container. A dependency of THIS crate only: the type
# (`ValueMap`) is what clients name, so the container stays out of their source.
indexmap = "2"
serde = { version = "1", optional = true }

[features]
default = []
# The value form's serde bridge (a packet, an MQ payload, a binding argument).
# Off by default: the segment's bytes are the format this crate is for.
serde = ["dep:serde"]

[dev-dependencies]
# The serde bridge's round-trip tests (behind `feature = "serde"`): JSON is the
# neutral text a bridge would hand over, so the test speaks it.
serde_json = "1"

[lints]
workspace = true