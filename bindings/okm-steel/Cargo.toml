[package]
name = "okm-steel"
version = "0.1.0"
edition = "2021"

[dependencies]
okm-core = { path = "../../okm-core", features = ["schema-serde"] }
okm-dynamic = { path = "../../okm-dynamic" }
okm-entry = { path = "../okm-entry" }
steel-core = "0.7"
serde_json = "1"
im-rc = "15"

# standalone crate — keep out of the okm root workspace
[workspace]

[dev-dependencies]
okm-derive = { path = "../../okm-derive" }

[lints.clippy]
# The same five the workspace root denies, for the same reason: a panic here is a
# dead interpreter or a dead host process, not a bad row. Nothing in these crates
# panics today; this is what keeps that true.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
