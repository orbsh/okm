[package]
name = "okm-steel"
version = "0.1.0"
edition = "2021"

[dependencies]
okm-core = { path = "../../okm-core", features = ["schema-serde"] }
okm-dynamic = { path = "../../okm-dynamic" }
okm-entry = { path = "../okm-entry" }
# The set ALGEBRA over two held key sets lives one crate up (okm-core owns the
# container, `okm-query` owns `intersect`/`union`/`difference` over ordered keys
# and now `HeldSets` over the container). Only the `key-set-and!` / `-or!` /
# `-minus!` verbs need it, and okm-query depends on okm-core alone, so the added
# tree is one thin crate — not the other direction, which would put the algebra
# in core and invert the dependency.
okm-query = { path = "../../okm-query" }
steel-core = "0.7"
serde_json = "1"
im-rc = "15"

# standalone crate — keep out of the okm root workspace
[workspace]

[dev-dependencies]
okm-derive = { path = "../../okm-derive" }

[lints.clippy]
# The same five the workspace root denies, for the same reason: a panic here is a
# dead interpreter or a dead host process, not a bad row. Nothing in these crates
# panics today; this is what keeps that true.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
