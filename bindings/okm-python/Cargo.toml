[package]
name = "okm-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "okm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
# Standalone-wheel builds pass this through to pyo3 (the cdylib must not
# link libpython — the interpreter hosts it). rlib consumers (probe's
# python carrier) build with default-features = false: pyo3 stays a
# REQUIRED dependency (the pyclass surface registers host-injected
# collections into session modules — ADR-0037 4.16a), and WITHOUT this
# feature pyo3 links the interpreter, which is what an embedding host
# needs. Feature unification is exactly why the flag must not ride the
# dependency declaration.
extension-module = ["pyo3/extension-module"]
# Host-reading tests (tests/injection.rs) link the interpreter — opt-in
# so the default `cargo test` (wheel posture, libpython FORBIDDEN)
# skips them instead of failing to link.
host-tests = ["pyo3/auto-initialize"]

[[test]]
name = "injection"
required-features = ["host-tests"]

[dependencies]
okm-core = { path = "../../okm-core", features = ["schema-serde", "test-engines"] }
okm-dynamic = { path = "../../okm-dynamic" }
okm-entry = { path = "../okm-entry" }
okm-wire = { path = "../../okm-wire" }
pyo3 = { version = "0.25" }
serde_json = "1"

# No [dev-dependencies] re-declaring pyo3: dev deps MERGE features with
# the main dep (cargo unification) — adding `pyo3` here would quietly
# re-enable extension-module for tests, the exact trap documented
# above. The injection tests run via `cargo test --no-default-features`
# and read PyErr messages through the linked interpreter.


# standalone crate — keep out of the okm root workspace
[workspace]
