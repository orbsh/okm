[package]
name = "okm-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "okm"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
# rlib consumers (probe's python carrier embeds OKM_SCHEMA_PY without
# linking the pyo3 extension) build with default-features = false.
extension-module = ["dep:pyo3"]

[dependencies]
okm-core = { path = "../../okm-core", features = ["schema-serde", "test-engines"] }
okm-dynamic = { path = "../../okm-dynamic" }
okm-wire = { path = "../../okm-wire" }
pyo3 = { version = "0.25", optional = true, features = ["extension-module"] }
serde_json = "1"

# standalone crate — keep out of the okm root workspace
[workspace]
