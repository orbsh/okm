[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "okm"
version = "0.1.0"
description = "OKM dynamic codec: schema-driven key/payload encode-decode for Python readers"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
include = [{ path = "okm_schema.py", format = ["sdist", "wheel"] }]
