[package]
name = "okm-entry"
version = "0.1.0"
edition = "2021"

[dependencies]
okm-core = { path = "../../okm-core", features = ["schema-serde", "test-engines"] }
okm-dynamic = { path = "../../okm-dynamic" }
serde_json = "1"

# standalone crate — keep out of the okm root workspace (the sibling
# bindings' posture; probe pulls it by git like okm-python/okm-steel)
[workspace]

[lints.clippy]
# The same five the workspace root denies, for the same reason: a panic here is a
# dead interpreter or a dead host process, not a bad row. Nothing in these crates
# panics today; this is what keeps that true.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
