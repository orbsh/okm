[package]
name = "okm-dynamic"
version = "0.1.0"
edition = "2024"

[dependencies]
okm-core = { path = "../okm-core" }
okm-value = { path = "../okm-value" }
serde = { version = "1", features = ["derive"], optional = true }
arrow = { version = "60", optional = true }

[dev-dependencies]
okm-derive = { path = "../okm-derive" }
okm-async = { path = "../okm-async", features = ["slatedb"] }
# The generation-replay test writes and reads a real changelog directory.
tempfile = "3"

[features]
default = []
serde = ["dep:serde"]
# The schema-driven column builder: a drainer has no row type, so the export it
# needs is the one built from the declaration (ADR-0045 §9).
arrow = ["dep:arrow"]
# The replay seam (ADR-0056 §5): replaying a segment is core's mechanism, and this
# crate supplies the target core cannot name. Turns on core's `schema-serde` because
# the log's sidecar is JSON — off by default, so a plain build stays free of it.
replay = ["okm-core/schema-serde"]

[lints]
workspace = true
[[test]]
name = "arrow_type_test"
required-features = ["arrow"]
