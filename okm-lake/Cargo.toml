[package]
name = "okm-lake"
autobins = false
version = "0.1.0"
edition = "2024"
description = "The exported lake: project the change log into Parquet, fold it, partition it, and reclaim what no version reads."

[lib]
name = "okm_lake"
path = "src/lib.rs"

[[bin]]
name = "okm-lake"
path = "src/main.rs"

[dependencies]
okm-core = { path = "../okm-core", features = ["schema-serde", "fjall"] }
okm-value = { path = "../okm-value" }
okm-wire = { path = "../okm-wire" }
okm-dynamic = { path = "../okm-dynamic", features = ["arrow", "replay"] }
arrow = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
parquet-variant = "60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A lake is a key space, not a directory: the same verbs write a bucket.
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["rt", "time"] }
futures = "0.3"
bytes = "1"

[dev-dependencies]
okm-derive = { path = "../okm-derive" }
okm-core = { path = "../okm-core", features = ["schema-serde"] }
okm-value = { path = "../okm-value" }
okm-async = { path = "../okm-async", features = ["slatedb"] }
parquet = { version = "60", default-features = false, features = ["arrow"] }
tempfile = "3"

[lints]
workspace = true